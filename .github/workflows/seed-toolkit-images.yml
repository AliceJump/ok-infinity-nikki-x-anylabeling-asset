# Bootstrap only; removed as soon as the two immutable runtime PNGs have been copied.
name: Seed Toolkit source images

on:
  push:
    branches: [codex/toolkit-template-authoring]
    paths:
      - ".github/workflows/seed-toolkit-images.yml"

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Copy pinned Nikki runtime images
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/AliceJump/ok-infinity-nikki.git /tmp/nikki-app
          git -C /tmp/nikki-app checkout --detach 180859128db637f769ea478f52fbae57d46210fa
          for img in 0.png 1.png; do
            cp "/tmp/nikki-app/assets/images/$img" "./$img"
            cmp "/tmp/nikki-app/assets/images/$img" "./$img"
          done
          python3 - <<'PY'
          import json, pathlib, struct
          data=json.loads(pathlib.Path('coco_annotations.json').read_text('utf-8'))
          images={img['id']: img for img in data['images']}
          names={entry['name'] for entry in data['categories']}
          assert names == {'dialog_icon','skip_b','skip_choose','skip_f','task_icon'}
          for img in images.values():
              assert img['file_name'] in {'0.png','1.png'}
              raw=pathlib.Path(img['file_name']).read_bytes()
              assert raw[:8] == b'\x89PNG\r\n\x1a\n'
              assert struct.unpack('>II',raw[16:24]) == (img['width'],img['height'])
          for item in data['annotations']:
              im=images[item['image_id']]
              x,y,w,h=item['bbox']
              assert 0<=x and 0<=y and w>0 and h>0 and x+w<=im['width'] and y+h<=im['height']
          assert len(data['annotations']) == 5
          PY
      - name: Commit original image bytes to the PR branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 0.png 1.png
          git diff --cached --quiet && exit 0
          git commit -m "assets: seed Toolkit template pages from Nikki runtime"
          git push "https://x-access-token:${GH_TOKEN}@github.com/AliceJump/ok-infinity-nikki-x-anylabeling-asset.git" HEAD:refs/heads/codex/toolkit-template-authoring
